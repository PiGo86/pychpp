[project]
name = "pychpp"
version = "0.6.1"
description = "framework created to use the API provided by the online game Hattrick"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pierre Gobin", email = "p.dev@gobin.cc" },
]
requires-python = ">=3.11"
dependencies = [
    "pytz>=2025.1",
    "werkzeug>=3.1.3",
    "requests-oauthlib>=2.0.0",
]

[project.urls]
Homepage = "https://framagit.org/Pierre86/pychpp"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pychpp"]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "D"]
# D105/D107: magic methods and __init__ are documented at class level (Google style)
ignore = ["D105", "D107"]

[tool.ruff.lint.per-file-ignores]
# Test functions are self-descriptive: no docstring required (D103)
"tests/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
