[project]
name = "pychpp"
version = "0.6.0"
description = "framework created to use the API provided by the online game Hattrick"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pierre Gobin", email = "p.dev@gobin.cc" },
]
requires-python = ">=3.11"
dependencies = [
    "pytz>=2025.1",
    "werkzeug>=3.1.3",
    "requests-oauthlib>=2.0.0",
]

[project.urls]
Homepage = "https://framagit.org/Pierre86/pychpp"

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-dotenv>=0.5.2",
    "flake8>=7.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pychpp"]
